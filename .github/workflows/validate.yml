name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/prod-hardening
      - 'audit/**'

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelsona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d reelsona_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reelsona_test
      SESSION_SECRET: ci-only-session-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10 --activate

      - name: Normalize dependencies and lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Persist normalized lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/prod-hardening-final'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already normalized"
          else
            git diff --check -- pnpm-lock.yaml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: normalize pnpm lockfile"
            git push origin HEAD:audit/prod-hardening-final
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Bootstrap current DB schema
        run: pnpm --filter @workspace/db run push-force

      - name: Validate SQL migration history
        run: |
          for migration in $(find lib/db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: API server tests
        run: pnpm --filter @workspace/api-server run test

      - name: Build
        run: pnpm run build