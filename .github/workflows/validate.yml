name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/prod-hardening
      - 'audit/**'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelsona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d reelsona_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reelsona_test
      SESSION_SECRET: ci-only-session-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10 --activate

      - name: Install dependencies
        # The repository currently has a pre-existing pnpm catalog/override
        # mismatch for lib/api-client-react (catalog: vs React 19.1.0). Use the
        # manifest as source of truth here so hardening CI can still execute
        # typecheck/tests/build. Normalize pnpm-lock.yaml in a dedicated follow-up.
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Bootstrap current DB schema
        run: pnpm --filter @workspace/db run push-force

      - name: Validate SQL migration history
        run: |
          for migration in $(find lib/db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: API server tests
        run: pnpm --filter @workspace/api-server run test

      - name: Build
        run: pnpm run build